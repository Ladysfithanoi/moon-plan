<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trăng rằm">
  <defs>
    <radialGradient id="disc" cx="38%" cy="33%" r="74%">
      <stop offset="0" stop-color="#FFFDF7" />
      <stop offset="55%" stop-color="#F6F2EA" />
      <stop offset="100%" stop-color="#E7C79C" />
    </radialGradient>
  </defs>

  <!-- trời đêm -->
  <rect width="64" height="64" rx="14" fill="#14110E" />

  <!-- quầng trăng -->
